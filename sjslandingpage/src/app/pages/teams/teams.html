<section class="py-24 bg-white">
    <div class="max-w-7xl mx-auto px-6">
        <h2 class="text-4xl font-bold text-gray-900 leading-tight">Struktur <span class="text-yellow-500">Keanggotaan</span>
        </h2>
        <div class="card overflow-x-auto mt-10">
            <p-organization-chart [value]="data" selectionMode="multiple" [(selection)]="selectedNodes"
                [collapsible]="true">
                <ng-template let-node pTemplate="default">
                    <div class="flex flex-col">
                        <div class="flex flex-col items-center">
                            <img [src]="node.data.image" class="mb-4 w-12 h-12" />
                            <div class="font-bold mb-2">{{ node.data.name }}</div>
                            <div>{{ node.data.title }}</div>
                        </div>
                    </div>
                </ng-template>
            </p-organization-chart>
        </div>
    </div>
</section>
